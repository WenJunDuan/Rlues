# 🧭 ============================= 分流规则 =============================
# 约定：除第 16 段外，所有 RULE-SET 带 no-resolve —— fake-ip 下连接只带域名，
#       中段若有不带 no-resolve 的 IP 规则，每个未命中域名都会被提前解析（多一次 DNS + 延迟 + 泄漏面）
rules:
  # 🔌 ===== 1. Tailscale / 私网 / 基础设施 =====
  - PROCESS-NAME,tailscaled.exe,DIRECT
  - PROCESS-NAME,tailscale-ipn.exe,DIRECT
  - PROCESS-NAME,tailscale.exe,DIRECT
  - PROCESS-NAME,tailscaled,DIRECT
  - PROCESS-NAME,tailscale,DIRECT
  - PROCESS-NAME,Tailscale,DIRECT
  - IP-CIDR,100.100.100.100/32,DIRECT,no-resolve
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
  - IP-CIDR6,fd7a:115c:a1e0::/48,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - DOMAIN-SUFFIX,ts.net,DIRECT
  - DOMAIN-SUFFIX,tailscale.com,DIRECT
  - DOMAIN-SUFFIX,tailscale.io,DIRECT
  - DOMAIN-KEYWORD,tailscale,DIRECT
  - RULE-SET,lan_non_ip,DIRECT
  - RULE-SET,lan_ip,DIRECT,no-resolve

  # 🚀 ===== 1b. Ookla / Speedtest（先于 QUIC 阻断）=====
  - DOMAIN-SUFFIX,speedtest.net,speedtest
  - DOMAIN-SUFFIX,speedtestcustom.com,speedtest
  - DOMAIN-SUFFIX,ooklaserver.net,speedtest
  - DOMAIN-SUFFIX,fast.com,speedtest
  - DOMAIN-SUFFIX,speed.cloudflare.com,speedtest
  - DOMAIN-KEYWORD,speedtest,speedtest
  - DOMAIN-KEYWORD,ookla,speedtest
  - RULE-SET,Speedtest,speedtest,no-resolve

  # 🚫 ===== 1c. 阻断海外 QUIC ≈ Surge block-quic = all-proxy =====
  - AND,((DST-PORT,443),(NETWORK,UDP),(NOT,((GEOIP,CN)))),REJECT

  # 🛡️ ===== 2. 加密 DNS 出站（respect-rules 下 DNS 连接也按此匹配）=====
  # 国内 DNS → DIRECT（含 Fries 厂商 DNS：百度 180.76.76.76 / 火山 180.184.1.1）
  - DOMAIN-SUFFIX,alidns.com,DIRECT
  - DOMAIN-SUFFIX,doh.pub,DIRECT
  - DOMAIN-SUFFIX,dns.pub,DIRECT
  - IP-CIDR,223.5.5.5/32,DIRECT,no-resolve
  - IP-CIDR,223.6.6.6/32,DIRECT,no-resolve
  - IP-CIDR,1.12.12.12/32,DIRECT,no-resolve
  - IP-CIDR,120.53.53.53/32,DIRECT,no-resolve
  - IP-CIDR,119.29.29.29/32,DIRECT,no-resolve
  - IP-CIDR,180.76.76.76/32,DIRECT,no-resolve
  - IP-CIDR,180.184.1.1/32,DIRECT,no-resolve

  # 国际 DoH → 节点
  - DOMAIN-SUFFIX,cloudflare-dns.com,🎯 节点选择
  - DOMAIN,dns.google,🎯 节点选择
  - IP-CIDR,1.1.1.1/32,🎯 节点选择,no-resolve
  - IP-CIDR,1.0.0.1/32,🎯 节点选择,no-resolve
  - IP-CIDR,8.8.8.8/32,🎯 节点选择,no-resolve
  - IP-CIDR,8.8.4.4/32,🎯 节点选择,no-resolve
  - IP-CIDR,9.9.9.9/32,🎯 节点选择,no-resolve

  # 🛑 ===== 2.5 拦截（同 Surge 2.5 + Fries HTTPDNS）=====
