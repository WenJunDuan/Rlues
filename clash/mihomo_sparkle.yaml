# ==========================================
# 🚀 Mihomo 配置 · v5.3 · 2026-11-06
# ==========================================
# 更新记录
# v5.5: 修 baidu 打不开（厂商 DNS 单点无兜底）；国内 DoH 扩到 4 个 IP；dns-mode 恢复留空（native 改 Linux 宿主机 DNS）
# v5.4: 新增韩国策略（select + 自动/散列/轮询），并入节点选择/故障转移/AI/社交/测速，冷门节点排除韩国
# v5.3: 对齐 Surge + Fries 通用模块；适配 mihomo v1.19.33
#       - 修 cdn_non_ip / download_non_ip behavior 错误（classical 写成 domain，规则集实际为空）
#       - cdn 改走代理（与 Surge 一致）；中段规则集统一 no-resolve，IP 类集中到末尾
#       - 节点筛选正则加词边界（修 Australia/Russia/Business→美国、德州/西雅图→欧盟、信息节点混入冷门）
#       - DNS 全 IP 化（兑现设计原则 2）；去 AdGuard（会过滤广告域名）；proxy-server-nameserver 去直连 1.1.1.1
#       - 移植 Fries：厂商分 DNS（nameserver-policy + inline 规则集）、always-real-ip → fake-ip-filter、HTTPDNS 阻断
#       - 移植 Surge：AWAvenue 广告、apple_intelligence、ai/ip、reject/ip、个人域名、Claude 规则统一用 Rlues/claude.list
#       - tun.dns-mode: native（v5.5 已撤回为留空，见 TUN 段）
#       - allow-lan 加 lan-allowed-ips，防公共 Wi-Fi 下被他人白嫖代理
# v5.2: 完整修复 TUN + Tailscale 共存
# v5.1: 跨平台 TUN 基础层; Tailscale/私网绕过; 删除平台专属 TUN 参数
# v5.0: 修正 Windows TUN 与 Tailscale 路由、DNS、进程冲突
# v4.9: 修正 GUI 延迟测试; GeoIP 改用 lite 数据
# v4.8: Speedtest 优先于 QUIC 阻断并补充测速域名
# v4.7: 适配 mihomo v1.19.27; 收紧控制器; 优化 geodata/DNS
#
# 内核要求: mihomo ≥ v1.19.31（ts 出站方案 B）；其余 v1.19.2x 可用
#
# 平台说明
# Linux 可本地启用 auto-redirect/gso; Windows 使用客户端覆盖接口名
# macOS 由客户端分配 utun; iOS/Android 无法同时运行两个独立 VPN → 见 Proxy 段 Tailscale 出站方案 B
#
# Tailscale 共存要点
# 1) 先连 Tailscale，再开 Mihomo TUN
# 2) Windows 网卡名一般为 Tailscale；Linux 为 tailscale0
# 3) 若 MagicDNS 仍异常: tailscale up --accept-dns=false
# 4) Linux 若 auto-detect 误选网卡，顶层加 interface-name: eth0 并关 auto-detect-interface
#
# ==========================================
# 🏗️ 设计原则
#
#    1️⃣ DIRECT vs 🏠 国内流量
#         DIRECT      = 基础设施 / 确定性直连 (不可被误切)
#         🏠 国内流量 = 仅 GEOIP,CN 兜底 (保留手动切换)
#    2️⃣ 🌐 DNS: respect-rules + direct-nameserver, 全 IP 形式 DoH, 无 fallback
#         与 Surge 分工差异：fake-ip 下代理流量远端解析，本地 nameserver 只服务规则匹配，
#         故默认走境外 DoH（经节点）防污染；直连出站由 direct-nameserver（国内 DoH）解析
#    3️⃣ 📏 规则: 域名类在前且带 no-resolve；需要解析的 IP 类集中在末尾（同 Surge）
#    4️⃣ 🎛️ 策略组: 节点选择(select) → 故障转移(fallback) → 地区策略(select) → 地区自动(url-test)
# ==========================================

# ⚓ ==================== 锚点配置 ====================
BaseFB:
  &BaseFB {
    type: fallback,
    interval: 300,
    lazy: true,
    url: "https://www.gstatic.com/generate_204",
    timeout: 5000,
    expected-status: 204,
  }
BaseCH:
  &BaseCH {
    type: load-balance,
    interval: 300,
    lazy: true,
    url: "https://www.gstatic.com/generate_204",
    strategy: consistent-hashing,
    timeout: 5000,
    expected-status: 204,
  }
BaseCR:
  &BaseCR {
    type: load-balance,
    interval: 300,
    lazy: true,
    url: "https://www.gstatic.com/generate_204",
    strategy: round-robin,
    timeout: 5000,
    expected-status: 204,
  }
BaseUT:
  &BaseUT {
    type: url-test,
    interval: 300,
    tolerance: 50,
    lazy: true,
    url: "https://www.gstatic.com/generate_204",
    timeout: 5000,
    expected-status: 204,
  }

# 节点筛选正则（regexp2；英文缩写加词边界，避免 US 命中 Australia/Russia/Business）
FilterHK: &FilterHK "(?i)^(?=.*(港|🇭🇰|Hong ?Kong|(?<![A-Za-z])(HK|HKG)(?![A-Za-z])))(?!.*(游戏|GAME|5x|剩余|到期|流量|官网|套餐|Expire|Traffic)).*$"
FilterSG: &FilterSG "(?i)^(?=.*(新加坡|坡|狮城|🇸🇬|Singapore|(?<![A-Za-z])(SG|SGP|SIN|XSP)(?![A-Za-z])))(?!.*(游戏|GAME|5x|剩余|到期|流量|官网|套餐|Expire|Traffic)).*$"
FilterJP: &FilterJP "(?i)^(?=.*(日本|东京|大阪|🇯🇵|Japan|Tokyo|Osaka|(?<![A-Za-z])(JP|JPN|NRT|HND|KIX|CTS|FUK)(?![A-Za-z])))(?!.*(游戏|GAME|5x|剩余|到期|流量|官网|套餐|Expire|Traffic)).*$"
FilterUS: &FilterUS "(?i)^(?=.*(美|🇺🇸|United States|America|洛杉矶|圣何塞|西雅图|硅谷|纽约|芝加哥|达拉斯|(?<![A-Za-z])(US|USA|SJC|JFK|LAX|ORD|ATL|DFW|SFO|MIA|SEA|IAD)(?![A-Za-z])))(?!.*(游戏|GAME|5x|剩余|到期|流量|官网|套餐|Expire|Traffic)).*$"
FilterTW: &FilterTW "(?i)^(?=.*(台|臺|🇹🇼|Taiwan|Taipei|Taichung|Tainan|Kaohsiung|Hsinchu|Taoyuan|新竹|桃园|桃園|彰化|高雄|(?<![A-Za-z])(TW|TWN|TPE|TSA|KHH|RMQ|TNN)(?![A-Za-z])))(?!.*(游戏|GAME|5x|剩余|到期|流量|官网|套餐|Expire|Traffic)).*$"
FilterKR: &FilterKR "(?i)^(?=.*(韩国|韓國|韓国|南韩|南韓|首尔|首爾|春川|🇰🇷|South ?Korea|Korea|Seoul|(?<![A-Za-z])(KR|KOR|ICN|SEL)(?![A-Za-z])))(?!.*(游戏|GAME|5x|剩余|到期|流量|官网|套餐|Expire|Traffic)).*$"
FilterEU: &FilterEU "(?i)^(?=.*(英国|英國|法国|德国|荷兰|意大利|西班牙|瑞士|瑞典|芬兰|丹麦|挪威|波兰|爱尔兰|奥地利|比利时|葡萄牙|伦敦|巴黎|法兰克福|阿姆斯特丹|🇬🇧|🇫🇷|🇩🇪|🇳🇱|🇮🇹|🇪🇸|🇨🇭|🇸🇪|🇫🇮|🇩🇰|🇳🇴|🇵🇱|🇮🇪|🇦🇹|🇧🇪|🇪🇺|United Kingdom|France|Germany|Netherlands|London|Paris|Frankfurt|Amsterdam|(?<![A-Za-z])(UK|GB|FR|DE|NL|CDG|FRA|AMS|LHR|MUC)(?![A-Za-z])))(?!.*(游戏|GAME|5x|剩余|到期|流量|官网|套餐|Expire|Traffic)).*$"
FilterOT: &FilterOT "(?i)^(?!.*(DIRECT|直连|韩国|韓國|韓国|南韩|南韓|首尔|首爾|春川|🇰🇷|South ?Korea|Korea|Seoul|(?<![A-Za-z])(KR|KOR|ICN|SEL)(?![A-Za-z])|港|🇭🇰|Hong ?Kong|(?<![A-Za-z])(HK|HKG)(?![A-Za-z])|新加坡|坡|狮城|🇸🇬|Singapore|(?<![A-Za-z])(SG|SGP|SIN|XSP)(?![A-Za-z])|日本|东京|大阪|🇯🇵|Japan|Tokyo|Osaka|(?<![A-Za-z])(JP|JPN|NRT|HND|KIX|CTS|FUK)(?![A-Za-z])|美|🇺🇸|United States|America|洛杉矶|圣何塞|西雅图|硅谷|纽约|芝加哥|达拉斯|(?<![A-Za-z])(US|USA|SJC|JFK|LAX|ORD|ATL|DFW|SFO|MIA|SEA|IAD)(?![A-Za-z])|台|臺|🇹🇼|Taiwan|Taipei|Taichung|Tainan|Kaohsiung|Hsinchu|Taoyuan|新竹|桃园|桃園|彰化|高雄|(?<![A-Za-z])(TW|TWN|TPE|TSA|KHH|RMQ|TNN)(?![A-Za-z])|英国|英國|法国|德国|荷兰|意大利|西班牙|瑞士|瑞典|芬兰|丹麦|挪威|波兰|爱尔兰|奥地利|比利时|葡萄牙|伦敦|巴黎|法兰克福|阿姆斯特丹|🇬🇧|🇫🇷|🇩🇪|🇳🇱|🇮🇹|🇪🇸|🇨🇭|🇸🇪|🇫🇮|🇩🇰|🇳🇴|🇵🇱|🇮🇪|🇦🇹|🇧🇪|🇪🇺|United Kingdom|France|Germany|Netherlands|London|Paris|Frankfurt|Amsterdam|(?<![A-Za-z])(UK|GB|FR|DE|NL|CDG|FRA|AMS|LHR|MUC)(?![A-Za-z])))(?!.*(游戏|GAME|5x|剩余|到期|流量|官网|套餐|Expire|Traffic)).*$"
FilterAL: &FilterAL "(?i)^(?!.*(DIRECT|直连|群|邀请|返利|循环|官网|客服|网站|过期|到期|剩余|流量|套餐|(?<![A-Za-z])(USE|USED|TOTAL|EXPIRE)(?![A-Za-z]))).*$"

